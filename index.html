<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thanh toán QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .field label {
      width: 80px;
      text-align: right;
      margin-right: 10px;
      font-size: 14px;
      color: #333;
      white-space: nowrap;
    }

    .field input {
      width: 200px;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
      margin: 16px 0;
    }

    img {
      margin-top: 12px;
      width: 260px;
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="box" id="app">
  <h2>Thanh toán QR</h2>

  <div class="field">
    <label>Số tiền</label>
    <input
      type="text"
      id="amount"
      placeholder="VND"
      inputmode="numeric"
      oninput="formatAmount()"
    >
  </div>

  <div class="field">
    <label>Mã đơn</label>
    <input
      type="text"
      id="order"
      placeholder="VD: DH1000"
      oninput="updateQR()"
    >
  </div>

  <button onclick="goFullscreen()">Toàn màn hình</button>

  <img
    id="qr"
    src="https://qr.sepay.vn/img?acc=VQRQAGGZT1124&bank=MBBank"
    alt="QR thanh toán"
  >

  <div class="note">
    Vui lòng kiểm tra đúng số tiền & mã đơn trước khi thanh toán
  </div>
</div>

<script>
  function formatAmount() {
    const input = document.getElementById("amount");

    // Lấy số thuần (bỏ dấu chấm)
    let raw = input.value.replace(/\D/g, "");

    if (raw === "") {
      updateQR();
      return;
    }

    // Format thêm dấu chấm ngăn cách nghìn
    input.value = raw.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    updateQR();
  }

  function updateQR() {
    const amountInput = document.getElementById("amount").value;
    const order = document.getElementById("order").value;
    const qr = document.getElementById("qr");

    // Số tiền gửi cho QR phải là số thuần
    const amount = amountInput.replace(/\./g, "");

    let url =
      "https://qr.sepay.vn/img?" +
      "acc=VQRQAGGZT1124" +
      "&bank=MBBank";

    if (amount && Number(amount) > 0) {
      url += "&amount=" + amount;
    }

    if (order) {
      url += "&des=" + encodeURIComponent(order);
    }

    qr.src = url;
  }

  function goFullscreen() {
    const elem = document.getElementById("app");
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }
  }
</script>

</body>
</html>
