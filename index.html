<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thanh toán QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 16px;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button.secondary {
      background: #666;
    }

    img {
      margin-top: 16px;
      width: 260px;
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="box" id="app">
  <h2>Thanh toán QR</h2>

  <input
    type="number"
    id="amount"
    placeholder="Nhập số tiền (VND)"
    oninput="updateQR()"
  >

  <input
    type="text"
    id="order"
    placeholder="Nhập mã đơn / hóa đơn"
    oninput="updateQR()"
  >

  <button onclick="goFullscreen()">Toàn màn hình</button>

  <img
    id="qr"
    src="https://qr.sepay.vn/img?acc=VQRQAGGZT1124&bank=MBBank"
    alt="QR thanh toán"
  >

  <div class="note">
    Vui lòng kiểm tra đúng số tiền & mã đơn trước khi thanh toán
  </div>
</div>

<script>
  function updateQR() {
    const amount = document.getElementById("amount").value;
    const order = document.getElementById("order").value;
    const qr = document.getElementById("qr");

    let url =
      "https://qr.sepay.vn/img?" +
      "acc=VQRQAGGZT1124" +
      "&bank=MBBank";

    if (amount && amount > 0) {
      url += "&amount=" + amount;
    }

    if (order) {
      url += "&des=" + encodeURIComponent(order);
    }

    qr.src = url;
  }

  function goFullscreen() {
    const elem = document.getElementById("app");
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }
  }
</script>

</body>
</html>
